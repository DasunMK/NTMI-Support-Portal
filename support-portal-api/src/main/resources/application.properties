# ===============================
# 1. SERVER CONFIGURATION
# ===============================
server.port=8080
# REMOVED: server.servlet.context-path=/api/v1 
# ^ Removing this allows your Controller's @RequestMapping("/tickets") to work at root level.

# ===============================
# 2. MSSQL DATABASE CONNECTION
# ===============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NTMI_Support_DB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=Password1234!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# 3. JPA / HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# 4. JWT & FILE SETTINGS
# ===============================
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
app.jwt.expiration-ms=86400000
app.file.upload-dir=uploads/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB